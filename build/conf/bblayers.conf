# POKY_BBLAYERS_CONF_VERSION is increased each time build/conf/bblayers.conf
# changes incompatibly
POKY_BBLAYERS_CONF_VERSION = "2"

BBPATH = "${TOPDIR}"
BBFILES ?= ""

# Repo root (parent of the build dir), so layer paths do not depend on
# where the repo is checked out.
BSPDIR := "${@os.path.abspath(os.path.join(d.getVar('TOPDIR'), os.pardir))}"

BBLAYERS ?= " \
  ${BSPDIR}/poky/meta \
  ${BSPDIR}/poky/meta-poky \
  ${BSPDIR}/poky/meta-yocto-bsp \
  ${BSPDIR}/meta-openembedded/meta-oe \
  ${BSPDIR}/meta-arm/meta-arm-toolchain \
  ${BSPDIR}/meta-arm/meta-arm \
  ${BSPDIR}/meta-ti/meta-ti-bsp \
  ${BSPDIR}/meta-ti/meta-ti-extras \
  ${BSPDIR}/meta-ti/meta-beagle \
  "
